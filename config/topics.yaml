# Relevance rules and topic tags. All patterns are regular expressions, matched
# case-insensitively unless wrapped in (?-i: ... ). Single quotes keep backslashes literal.
#
# ai_terms decide whether an item from a *general* source (HN, BBC, NYT...) is about AI:
#   - one `strong` hit is enough
#   - `weak` terms need company: two different ones
# Sources that are AI-only (OpenAI's blog, arXiv cs.AI...) skip this check (ai_filter: off).

ai_terms:
  strong:
    - '\b(?-i:AIs?|A\.I\.)(?!\w)'
    - '\bartificial intelligence\b'
    - '\bmachine learning\b'
    - '\bdeep learning\b'
    - '\bneural (?:net|network)s?\b'
    - '\blarge language models?\b'
    - '\b(?-i:LLMs?|SLMs?|VLMs?)\b'
    - '\bgenerative (?:ai|models?)\b'
    - '\bgen ?ai\b'
    - '\bchatgpt\b'
    - '\bgpt[- ]?(?:\d|oss|image)'
    - '\bopenai\b'
    - '\banthropic\b'
    - '\bclaude (?:code|opus|sonnet|haiku|\d)'
    - '\bgemini (?:\d|pro|flash|ultra|nano|cli)'
    - '\bllama[ -]?\d'
    - '\bllama\.cpp\b'
    - '\bmistral ai\b'
    - '\bdeepseek\b'
    - '\bqwen\d*\b'
    - '\b(?-i:xAI)\b'
    - '\bgrok[ -]?\d'
    - '\bhugging ?face\b'
    - '\bstable diffusion\b'
    - '\bmidjourney\b'
    - '\bdall[- ]?e\b'
    - '\bagentic\b'
    - '\bfoundation models?\b'
    - '\bmultimodal\b'
    - '\breasoning models?\b'
    - '\bprompt injection\b'
    - '\bmodel context protocol\b'
    - '\bretrieval[- ]augmented\b'
    - '\b(?-i:AGI|ASI)\b'
    - '\bsuperintelligen(?:ce|t)\b'
    - '\b(?:vllm|ollama|llamaindex|langchain|langgraph)\b'
  weak:
    - '\b(?:claude|gemini|llama|mistral|grok|sora|copilot|cursor|codex|perplexity|devin)\b'
    - '\bgpts?\b'
    - '\btransformers?\b'
    - '\bdiffusion\b'
    - '\bembeddings?\b'
    - '\bfine-?tun(?:e|ed|es|ing)\b'
    - '\binference\b'
    - '\bprompt(?:s|ing)?\b'
    - '\bchatbots?\b'
    - '\bagents?\b'
    - '\b(?-i:RAG|MCP)\b'
    - '\b(?:gpus?|tpus?|cuda)\b'
    - '\bnvidia\b'
    - '\bbenchmarks?\b'
    - '\brobot(?:s|ics)?\b'
    - '\bautonomous\b'
    - '\bself-driving\b'
    - '\bopen[- ]weights?\b'
    - '\bdata ?cent(?:er|re)s?\b'
    - '\bsemiconductors?\b'

