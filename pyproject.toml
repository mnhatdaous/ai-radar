[project]
name = "ai-radar"
version = "0.1.0"
description = "Daily crawler for AI news, research, tools, models and repos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "lxml>=5.2",
    "markdown-it-py>=4.3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0.1",
]

[project.scripts]
ai-radar = "ai_radar.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
# E501: the formatter owns layout; long SQL and message strings are fine.
# RUF001-3: we deliberately use typographic characters (…, —, ·, ★) in output strings.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
